name: publish-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact approved SemVer without v prefix
        required: true
        type: string
      source_commit:
        description: Exact approved 40-hex source commit
        required: true
        type: string
      candidate_run_id:
        description: prepare-release run containing the approved assets
        required: true
        type: string
      package_sha256:
        description: Exact approved package SHA-256
        required: true
        type: string
      checksums_sha256:
        description: Exact approved SHA256SUMS SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mysql-candidate-assets
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify exact approved unpublished bytes
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CHECKSUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          package="dist/mysql-${VERSION}.sigil-plugin.tar.zst"
          test -f "$package"
          test -f dist/SHA256SUMS
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          printf '%s  %s\n' "$PACKAGE_SHA256" "$package" | sha256sum --check --strict
          printf '%s  %s\n' "$CHECKSUMS_SHA256" dist/SHA256SUMS | sha256sum --check --strict
          test "$(cat dist/SHA256SUMS)" = "$PACKAGE_SHA256  mysql-${VERSION}.sigil-plugin.tar.zst"
      - name: Stage, read back, and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          package="mysql-${VERSION}.sigil-plugin.tar.zst"
          verify_assets() {
            verify_dir="$(mktemp -d)"
            gh release download "$tag" --dir "$verify_dir"
            test "$(find "$verify_dir" -maxdepth 1 -type f | wc -l)" -eq 2
            test "$(sha256sum "$verify_dir/$package" | cut -d' ' -f1)" = "$PACKAGE_SHA256"
            test "$(sha256sum "$verify_dir/SHA256SUMS" | cut -d' ' -f1)" = "$CHECKSUMS_SHA256"
            test "$(cat "$verify_dir/SHA256SUMS")" = "$PACKAGE_SHA256  $package"
          }
          ensure_draft_asset() {
            asset_name="$1"
            source_path="$2"
            expected_sha256="$3"
            asset_count="$(gh release view "$tag" --json assets --jq \
              "[.assets[] | select(.name == \"$asset_name\")] | length")"
            case "$asset_count" in
              0)
                gh release upload "$tag" "$source_path"
                ;;
              1)
                existing_dir="$(mktemp -d)"
                gh release download "$tag" --pattern "$asset_name" --dir "$existing_dir"
                test "$(sha256sum "$existing_dir/$asset_name" | cut -d' ' -f1)" = "$expected_sha256"
                ;;
              *)
                echo "release has duplicate asset $asset_name" >&2
                exit 1
                ;;
            esac
          }
          verify_tag_commit() {
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$SOURCE_COMMIT"
          }

          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')" = "$SOURCE_COMMIT"
            unexpected_assets="$(gh release view "$tag" --json assets --jq \
              "[.assets[].name | select(. != \"$package\" and . != \"SHA256SUMS\")] | length")"
            test "$unexpected_assets" -eq 0
            if test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = false; then
              verify_assets
              verify_tag_commit
              test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.immutable')" = true
              exit 0
            fi
          else
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "refusing a tag without the exact resumable draft ${tag}" >&2
              exit 1
            fi
            gh release create "$tag" \
              --target "$SOURCE_COMMIT" \
              --title "mysql ${VERSION}" \
              --notes "Immutable Sigil MySQL plugin ${VERSION}." \
              --draft
          fi

          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = true
          ensure_draft_asset "$package" "dist/$package" "$PACKAGE_SHA256"
          ensure_draft_asset "SHA256SUMS" dist/SHA256SUMS "$CHECKSUMS_SHA256"
          verify_assets
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="$SOURCE_COMMIT" >/dev/null; then
              echo "tag creation raced; requiring the winner to be exact" >&2
            fi
          fi
          verify_tag_commit
          gh release edit "$tag" --draft=false --latest=false
          for _ in 1 2 3 4 5 6; do
            if test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.immutable')" = true; then
              verify_tag_commit
              verify_assets
              exit 0
            fi
            sleep 5
          done
          echo "published release did not become immutable" >&2
          exit 1
