name: publish-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact approved SemVer without v prefix
        required: true
        type: string
      source_commit:
        description: Exact approved 40-hex source commit
        required: true
        type: string
      candidate_run_id:
        description: prepare-release run containing the approved assets
        required: true
        type: string
      package_sha256:
        description: Exact approved package SHA-256
        required: true
        type: string
      checksums_sha256:
        description: Exact approved SHA256SUMS SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mysql-candidate-assets
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify exact approved unpublished bytes
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CHECKSUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          package="dist/mysql-${VERSION}.sigil-plugin.tar.zst"
          test -f "$package"
          test -f dist/SHA256SUMS
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          printf '%s  %s\n' "$PACKAGE_SHA256" "$package" | sha256sum --check --strict
          printf '%s  %s\n' "$CHECKSUMS_SHA256" dist/SHA256SUMS | sha256sum --check --strict
          test "$(cat dist/SHA256SUMS)" = "$PACKAGE_SHA256  mysql-${VERSION}.sigil-plugin.tar.zst"
      - name: Stage, read back, and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          CHECKSUMS_SHA256: ${{ inputs.checksums_sha256 }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          package="mysql-${VERSION}.sigil-plugin.tar.zst"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "refusing to reuse existing tag ${tag}" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "refusing to reuse existing release ${tag}" >&2
            exit 1
          fi
          gh release create "$tag" \
            --target "$SOURCE_COMMIT" \
            --title "mysql ${VERSION}" \
            --notes "Immutable Sigil MySQL plugin ${VERSION}." \
            --draft \
            "dist/${package}" dist/SHA256SUMS
          draft_dir="$(mktemp -d)"
          gh release download "$tag" --dir "$draft_dir"
          test "$(sha256sum "$draft_dir/$package" | cut -d' ' -f1)" = "$PACKAGE_SHA256"
          test "$(sha256sum "$draft_dir/SHA256SUMS" | cut -d' ' -f1)" = "$CHECKSUMS_SHA256"
          test "$(gh release view "$tag" --json isDraft,targetCommitish --jq '.isDraft')" = true
          test "$(gh release view "$tag" --json isDraft,targetCommitish --jq '.targetCommitish')" = "$SOURCE_COMMIT"
          gh release edit "$tag" --draft=false --latest=false
          for _ in 1 2 3 4 5 6; do
            if test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.immutable')" = true; then
              exit 0
            fi
            sleep 5
          done
          echo "published release did not become immutable" >&2
          exit 1
