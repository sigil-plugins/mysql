[deploy]
backend = "external"

[plugins]
allow_third_party = true

[plugins.trust]
install_allowlist = ["github:conformance/mysql"]

[plugins.trust.capability_allowlist]
network = ["github:conformance/mysql"]
secrets = ["github:conformance/mysql"]

[plugins.require]
mysql = { version = "=0.2.0", source = "github:conformance/mysql" }

[plugins.grants.mysql]
secrets = ["MYSQL_USER", "MYSQL_PASSWORD"]

[plugins.grants.mysql.network.database]
target = "database:3306"
tls = "disabled"
max_bytes = "8MiB"
