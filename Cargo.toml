[package]
name = "sigil-plugin-mysql"
version = "0.2.1-rc.1"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand_chacha = { version = "0.3.1", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
rsa = { version = "0.9.8", default-features = false, features = ["pem", "u64_digit"] }
sha1 = { version = "0.10.6", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc"] }
zeroize = { version = "=1.9.0", default-features = false }

[dev-dependencies]
proptest = "1.9.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
